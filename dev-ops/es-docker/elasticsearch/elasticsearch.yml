cluster.name: ${ES_DOCKER_CLUSTER_NAME}
network.host: 0.0.0.0
node.name: ${ES_DOCKER_NODE_NAME}
discovery.seed_hosts: ["127.0.0.1", "[::1]"]
cluster.initial_master_nodes: ["${ES_DOCKER_NODE_NAME}"]
path.data: ["/usr/share/elasticsearch/data1", "/usr/share/elasticsearch/data2"]
http.cors.enabled: true
http.cors.allow-origin: /.*/
http.cors.allow-methods: OPTIONS,HEAD,GET,POST,PUT,DELETE
http.cors.allow-headers: Authorization,X-Requested-With,X-Auth-Token,Content-Type,Content-Length
http.cors.allow-credentials: true
xpack.security.enabled: true
xpack.security.transport.ssl.enabled: false
