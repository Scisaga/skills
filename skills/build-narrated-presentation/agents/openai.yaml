interface:
  display_name: "Build Narrated Presentation"
  short_description: "从文档分阶段制作静态、动画、旁白 PPTX 与视频"
  icon_small: "./assets/logo.svg"
  icon_large: "./assets/logo.svg"
  brand_color: "#A78BFA"
  default_prompt: "使用 $build-narrated-presentation 先验证输入文档并确认交付目标，再依次确认逐页文字稿、PPT 模板和代表性 SVG。按需制作静态、动画、逐页旁白 PPTX 或视频；跨页语气用章节连续合成后切成逐页 MP3，禁止一个 MP3 跨多页，并按 static、audio、standard、release 分级验收。"
