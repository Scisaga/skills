<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #F5F7FA; }
      .title { font-size: 58px; font-weight: 800; }
      .subtitle { font-size: 23px; font-weight: 500; fill: #AEB7C6; }
      .eyebrow { font-size: 18px; font-weight: 800; letter-spacing: 2px; }
      .column { font-size: 24px; font-weight: 900; }
      .row-title { font-size: 24px; font-weight: 800; }
      .body { font-size: 19px; font-weight: 600; fill: #CED4DE; }
      .token { font-size: 17px; font-weight: 800; }
    </style>
  </defs>

  <g id="base">
    <rect width="1600" height="900" fill="#111318"/>
    <rect x="64" y="68" width="9" height="96" rx="4.5" fill="#A978FF"/>
    <rect x="64" y="238" width="1472" height="568" rx="28" fill="#1B1F27" stroke="#343B49" stroke-width="3"/>
    <path d="M396 238 V806 M776 238 V806 M1156 238 V806" fill="none" stroke="#343B49" stroke-width="3"/>
    <path d="M64 346 H1536 M64 498 H1536 M64 650 H1536" fill="none" stroke="#343B49" stroke-width="3"/>
    <text x="64" y="854" class="token" fill="#7F8999">原创技术矩阵样板 · 1600 × 900</text>
    <circle cx="1485" cy="100" r="42" fill="#242A35" stroke="#A978FF" stroke-width="3"/>
    <path d="M1463 100 H1507 M1485 78 V122" stroke="#A978FF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g id="title">
    <text x="102" y="112" class="title">能力边界一页看清</text>
    <text x="102" y="154" class="subtitle">用统一维度比较输入、执行与验证，避免功能列表失去上下文</text>
  </g>

  <g id="beat_01">
    <rect x="64" y="238" width="332" height="108" rx="28" fill="#242A35"/>
    <text x="96" y="285" class="eyebrow" fill="#AEB7C6">DIMENSION</text>
    <text x="96" y="320" class="column">比较维度</text>

    <rect x="396" y="238" width="380" height="108" fill="#6E4ACF"/>
    <circle cx="448" cy="292" r="27" fill="#C8B3FF"/>
    <path d="M434 292 H462 M448 278 V306" stroke="#151922" stroke-width="6" stroke-linecap="round"/>
    <text x="493" y="300" class="column">输入层</text>

    <rect x="776" y="238" width="380" height="108" fill="#087F8C"/>
    <circle cx="828" cy="292" r="27" fill="#82E6EE"/>
    <path d="M812 292 H844 M820 281 L812 292 L820 303 M836 281 L844 292 L836 303" fill="none" stroke="#151922" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="873" y="300" class="column">执行层</text>

    <path d="M1156 266 Q1156 238 1184 238 H1508 Q1536 238 1536 266 V346 H1156 Z" fill="#B88700"/>
    <circle cx="1208" cy="292" r="27" fill="#FFE08A"/>
    <path d="M1193 292 l11 12 21-25" fill="none" stroke="#151922" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1253" y="300" class="column">验证层</text>
  </g>

  <g id="beat_02">
    <text x="96" y="407" class="row-title">核心问题</text>
    <text x="96" y="443" class="body">每层首先回答什么</text>

    <rect x="428" y="374" width="316" height="94" rx="18" fill="#2A223C" stroke="#A978FF" stroke-width="2"/>
    <text x="456" y="413" class="row-title" font-size="22">信息可靠吗？</text>
    <text x="456" y="445" class="body">来源、范围、约束</text>

    <rect x="808" y="374" width="316" height="94" rx="18" fill="#17343A" stroke="#27C3D1" stroke-width="2"/>
    <text x="836" y="413" class="row-title" font-size="22">动作可控吗？</text>
    <text x="836" y="445" class="body">权限、顺序、回退</text>

    <rect x="1188" y="374" width="316" height="94" rx="18" fill="#3B321A" stroke="#F6C344" stroke-width="2"/>
    <text x="1216" y="413" class="row-title" font-size="22">结果可信么？</text>
    <text x="1216" y="445" class="body">证据、差异、完成度</text>
  </g>

  <g id="beat_03">
    <text x="96" y="559" class="row-title">关键对象</text>
    <text x="96" y="595" class="body">只呈现稳定名词</text>

    <rect x="428" y="526" width="96" height="38" rx="19" fill="#6E4ACF"/>
    <text x="476" y="552" text-anchor="middle" class="token">文档</text>
    <rect x="536" y="526" width="96" height="38" rx="19" fill="#4B3A79"/>
    <text x="584" y="552" text-anchor="middle" class="token">事实</text>
    <rect x="644" y="526" width="100" height="38" rx="19" fill="#343044"/>
    <text x="694" y="552" text-anchor="middle" class="token">边界</text>

    <rect x="808" y="526" width="96" height="38" rx="19" fill="#087F8C"/>
    <text x="856" y="552" text-anchor="middle" class="token">任务</text>
    <rect x="916" y="526" width="96" height="38" rx="19" fill="#245A61"/>
    <text x="964" y="552" text-anchor="middle" class="token">工具</text>
    <rect x="1024" y="526" width="100" height="38" rx="19" fill="#293D42"/>
    <text x="1074" y="552" text-anchor="middle" class="token">状态</text>

    <rect x="1188" y="526" width="96" height="38" rx="19" fill="#B88700"/>
    <text x="1236" y="552" text-anchor="middle" class="token">摘要</text>
    <rect x="1296" y="526" width="96" height="38" rx="19" fill="#755D1A"/>
    <text x="1344" y="552" text-anchor="middle" class="token">报告</text>
    <rect x="1404" y="526" width="100" height="38" rx="19" fill="#443C28"/>
    <text x="1454" y="552" text-anchor="middle" class="token">证据</text>
  </g>

  <g id="beat_04">
    <text x="96" y="711" class="row-title">完成标准</text>
    <text x="96" y="747" class="body">用动词表达输出</text>

    <circle cx="450" cy="718" r="18" fill="#A978FF"/>
    <path d="M442 718 l6 7 12-15" fill="none" stroke="#151922" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="482" y="726" class="row-title" font-size="22">确认输入可用</text>
    <text x="482" y="760" class="body">不合格则原路返工</text>

    <circle cx="830" cy="718" r="18" fill="#27C3D1"/>
    <path d="M822 718 l6 7 12-15" fill="none" stroke="#151922" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="862" y="726" class="row-title" font-size="22">完成最小动作</text>
    <text x="862" y="760" class="body">失败可定位、可恢复</text>

    <circle cx="1210" cy="718" r="18" fill="#F6C344"/>
    <path d="M1202 718 l6 7 12-15" fill="none" stroke="#151922" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1242" y="726" class="row-title" font-size="22">交付可核验证据</text>
    <text x="1242" y="760" class="body">自动检查与人工观看分开</text>
  </g>
</svg>
