<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#151922"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#E5484D"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #151922; }
      .title { font-size: 58px; font-weight: 800; }
      .subtitle { font-size: 23px; font-weight: 500; fill: #596273; }
      .eyebrow { font-size: 18px; font-weight: 800; letter-spacing: 2px; }
      .card-title { font-size: 28px; font-weight: 800; }
      .body { font-size: 20px; font-weight: 600; fill: #454D5C; }
      .pill { font-size: 17px; font-weight: 800; }
      .step { font-size: 19px; font-weight: 900; fill: #FFFFFF; }
      .line-label { font-size: 17px; font-weight: 800; }
    </style>
  </defs>

  <g id="base">
    <rect width="1600" height="900" fill="#F8FAFC"/>
    <circle cx="1490" cy="80" r="50" fill="#E9F8F0"/>
    <path d="M1468 82 l16 16 30-34" fill="none" stroke="#22A06B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1394" y="160" class="eyebrow" fill="#22A06B">SYSTEM MAP</text>
    <rect x="64" y="68" width="9" height="96" rx="4.5" fill="#22A06B"/>
    <text x="64" y="850" class="pill" fill="#7B8494">原创技术信息图样板 · 1600 × 900</text>
  </g>

  <g id="title">
    <text x="102" y="112" class="title">从请求到可靠结果</text>
    <text x="102" y="154" class="subtitle">用一个主流程、一条异常支路和明确状态解释复杂系统</text>
  </g>

  <g id="beat_01">
    <rect x="64" y="244" width="320" height="390" rx="24" fill="#DDEBFF" stroke="#151922" stroke-width="3"/>
    <rect x="88" y="268" width="58" height="36" rx="18" fill="#151922"/>
    <text x="117" y="293" text-anchor="middle" class="step">01</text>
    <rect x="88" y="330" width="112" height="112" rx="28" fill="#FFFFFF" stroke="#151922" stroke-width="3"/>
    <circle cx="144" cy="366" r="20" fill="#8CB5FF" stroke="#151922" stroke-width="4"/>
    <path d="M109 421 C113 390 175 390 179 421" fill="#2F6BFF" stroke="#151922" stroke-width="4" stroke-linejoin="round"/>
    <text x="88" y="492" class="card-title">输入</text>
    <text x="88" y="534" class="body">统一请求格式</text>
    <text x="88" y="568" class="body">补全上下文</text>
    <rect x="88" y="592" width="126" height="28" rx="14" fill="#BFD5FF"/>
    <text x="151" y="612" text-anchor="middle" class="pill">可追溯来源</text>
  </g>

  <g id="beat_02">
    <path d="M384 440 H447" fill="none" stroke="#151922" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow-dark)"/>
    <text x="416" y="418" text-anchor="middle" class="line-label">校验</text>
    <rect x="458" y="244" width="320" height="390" rx="24" fill="#EDE4FF" stroke="#151922" stroke-width="3"/>
    <rect x="482" y="268" width="58" height="36" rx="18" fill="#151922"/>
    <text x="511" y="293" text-anchor="middle" class="step">02</text>
    <rect x="482" y="330" width="112" height="112" rx="28" fill="#FFFFFF" stroke="#151922" stroke-width="3"/>
    <path d="M512 360 H564 M512 385 H552 M512 410 H568" fill="none" stroke="#7C4DFF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="572" cy="384" r="18" fill="#C5AEFF" stroke="#151922" stroke-width="4"/>
    <text x="482" y="492" class="card-title">决策</text>
    <text x="482" y="534" class="body">匹配执行路径</text>
    <text x="482" y="568" class="body">显式记录边界</text>
    <rect x="482" y="592" width="126" height="28" rx="14" fill="#D6C6FF"/>
    <text x="545" y="612" text-anchor="middle" class="pill">规则先行</text>
  </g>

  <g id="beat_03">
    <path d="M778 440 H841" fill="none" stroke="#151922" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow-dark)"/>
    <text x="810" y="418" text-anchor="middle" class="line-label">路由</text>
    <rect x="852" y="244" width="320" height="390" rx="24" fill="#FFF0D6" stroke="#151922" stroke-width="3"/>
    <rect x="876" y="268" width="58" height="36" rx="18" fill="#151922"/>
    <text x="905" y="293" text-anchor="middle" class="step">03</text>
    <rect x="876" y="330" width="112" height="112" rx="28" fill="#FFFFFF" stroke="#151922" stroke-width="3"/>
    <rect x="902" y="353" width="60" height="26" rx="6" fill="#F9C56D" stroke="#151922" stroke-width="4"/>
    <rect x="902" y="393" width="60" height="26" rx="6" fill="#FFFFFF" stroke="#151922" stroke-width="4"/>
    <circle cx="914" cy="366" r="4" fill="#151922"/>
    <circle cx="914" cy="406" r="4" fill="#151922"/>
    <text x="876" y="492" class="card-title">执行</text>
    <text x="876" y="534" class="body">调用最小能力集</text>
    <text x="876" y="568" class="body">持续报告状态</text>
    <rect x="876" y="592" width="126" height="28" rx="14" fill="#FFDFA3"/>
    <text x="939" y="612" text-anchor="middle" class="pill">过程可见</text>
  </g>

  <g id="beat_04">
    <path d="M1172 440 H1235" fill="none" stroke="#151922" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow-dark)"/>
    <text x="1204" y="418" text-anchor="middle" class="line-label">交付</text>
    <rect x="1246" y="244" width="290" height="390" rx="24" fill="#DDF7E8" stroke="#151922" stroke-width="3"/>
    <rect x="1270" y="268" width="58" height="36" rx="18" fill="#151922"/>
    <text x="1299" y="293" text-anchor="middle" class="step">04</text>
    <rect x="1270" y="330" width="112" height="112" rx="28" fill="#FFFFFF" stroke="#151922" stroke-width="3"/>
    <circle cx="1326" cy="386" r="34" fill="#78D7A5" stroke="#151922" stroke-width="4"/>
    <path d="M1307 386 l14 15 27-31" fill="none" stroke="#151922" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1270" y="492" class="card-title">结果</text>
    <text x="1270" y="534" class="body">校验交付物</text>
    <text x="1270" y="568" class="body">沉淀反馈证据</text>
    <rect x="1270" y="592" width="126" height="28" rx="14" fill="#AEE9C9"/>
    <text x="1333" y="612" text-anchor="middle" class="pill">闭环完成</text>
  </g>

  <g id="beat_05">
    <rect x="458" y="700" width="714" height="90" rx="22" fill="#FFE0E5" stroke="#E5484D" stroke-width="3"/>
    <circle cx="505" cy="745" r="23" fill="#E5484D"/>
    <text x="505" y="753" text-anchor="middle" class="step">!</text>
    <text x="548" y="738" class="card-title" font-size="24">异常不隐藏</text>
    <text x="548" y="770" class="body">失败返回决策层，保留原因、影响与下一步</text>
    <path d="M1012 634 V671 H778 V634" fill="none" stroke="#E5484D" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow-red)"/>
    <text x="895" y="683" text-anchor="middle" class="line-label" fill="#E5484D">回退</text>
  </g>
</svg>
