volumes:
  etc_wireguard: {}

services:
  wg-easy:
    build:
      context: .
      args:
        WG_EASY_BASE_IMAGE: ${WG_EASY_BASE_IMAGE}
        WG_PASSWORD_MIN_LENGTH: ${WG_PASSWORD_MIN_LENGTH}
    environment:
      INSECURE: ${WG_UI_INSECURE:-false}
    image: ${WG_EASY_IMAGE}
    container_name: ${WG_CONTAINER_NAME}
    networks:
      wg:
        ipv4_address: ${WG_DOCKER_IPV4_ADDRESS}
        ipv6_address: ${WG_DOCKER_IPV6_ADDRESS}
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "${WG_PORT}:${WG_PORT}/udp"
      - "${WG_WEB_BIND}:${WG_WEB_PORT}:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1

networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: ${WG_DOCKER_IPV4_SUBNET}
        - subnet: ${WG_DOCKER_IPV6_SUBNET}
