# Nginx example for fronting GitLab and its registry.
# Render or edit this file outside the repository with your actual values.

server {
    listen ${GITLAB_NGINX_HTTP_PORT};
    server_name ${GITLAB_EXTERNAL_HOST} ${GITLAB_REGISTRY_EXTERNAL_HOST};
    return 301 ${GITLAB_NGINX_REDIRECT_BASE}$request_uri;
}

server {
    listen ${GITLAB_NGINX_HTTPS_PORT} ssl http2;
    listen [::]:${GITLAB_NGINX_HTTPS_PORT} ssl http2;
    server_name ${GITLAB_EXTERNAL_HOST};

    ssl_certificate ${GITLAB_NGINX_SSL_CERT};
    ssl_certificate_key ${GITLAB_NGINX_SSL_KEY};

    client_max_body_size 0;
    chunked_transfer_encoding on;

    location / {
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_redirect off;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://${GITLAB_NGINX_UPSTREAM_HOST}:${GITLAB_NGINX_UPSTREAM_PORT};
    }
}

server {
    listen ${GITLAB_NGINX_HTTPS_PORT} ssl http2;
    listen [::]:${GITLAB_NGINX_HTTPS_PORT} ssl http2;
    server_name ${GITLAB_REGISTRY_EXTERNAL_HOST};

    ssl_certificate ${GITLAB_NGINX_SSL_CERT};
    ssl_certificate_key ${GITLAB_NGINX_SSL_KEY};

    client_max_body_size 0;
    chunked_transfer_encoding on;

    location / {
        proxy_read_timeout 900;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://${GITLAB_REGISTRY_NGINX_UPSTREAM_HOST}:${GITLAB_REGISTRY_NGINX_UPSTREAM_PORT};
    }
}
